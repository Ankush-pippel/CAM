<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ArtOfComposition Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    #camera-container { position: relative; width: 100vw; height: 100vh; }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    /* Top Bar */
    .top-bar {
      position: absolute; top: 15px; left: 0; width: 100%;
      display: flex; justify-content: center; z-index: 10;
    }
    .status-pill {
      background: rgba(0,0,0,0.6); padding: 6px 14px;
      border-radius: 20px; font-size: 13px; border: 1px solid #444; backdrop-filter: blur(4px);
    }
    .status-pill.aligned { border-color: #00ff66; color: #00ff66; font-weight: bold; }

    /* Bottom Controls */
    .bottom-controls {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px;
    }
    .mode-selector {
      display: flex; gap: 8px; overflow-x: auto; max-width: 95%; padding: 5px 10px; scrollbar-width: none;
    }
    .mode-selector::-webkit-scrollbar { display: none; }
    .mode-btn {
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.1); color: #eee;
      padding: 7px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .mode-btn.active { background: #fff; color: #000; font-weight: bold; }

    .shutter-btn {
      width: 72px; height: 72px; border-radius: 50%;
      border: 4px solid #fff; background: transparent; padding: 4px; cursor: pointer;
    }
    .shutter-inner { width: 100%; height: 100%; background: #fff; border-radius: 50%; }
  </style>
</head>
<body>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>

  <div class="top-bar">
    <div id="level-pill" class="status-pill">Level: Checking...</div>
  </div>

  <div class="bottom-controls">
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('thirds')">Rule of Thirds</button>
      <button class="mode-btn" onclick="setMode('center')">Symmetry</button>
      <button class="mode-btn" onclick="setMode('golden')">Golden Ratio</button>
      <button class="mode-btn" onclick="setMode('diagonal')">Diagonal</button>
      <button class="mode-btn" onclick="setMode('cinematic')">Cinematic</button>
      <button class="mode-btn" onclick="setMode('leading')">Leading Lines</button>
      <button class="mode-btn" onclick="setMode('spiral')">Golden Spiral</button>
    </div>
    <button class="shutter-btn" onclick="takeSnapshot()">
      <div class="shutter-inner"></div>
    </button>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const levelPill = document.getElementById('level-pill');

  let currentMode = 'thirds';
  let isLevel = false;

  // 1. Camera Initialization
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
    } catch (err) {
      alert("कैमरा एक्सेस की अनुमति दें: " + err);
    }
  }

  // 2. Gyroscope Orientation Tracking
  window.addEventListener('deviceorientation', (e) => {
    const roll = e.gamma;
    if (roll !== null) {
      const deg = Math.abs(roll).toFixed(1);
      if (Math.abs(roll) < 1.5 || Math.abs(roll - 90) < 1.5) {
        if (!isLevel && navigator.vibrate) navigator.vibrate(40);
        isLevel = true;
        levelPill.className = 'status-pill aligned';
        levelPill.innerText = `🟢 Horizon Level: Perfect`;
      } else {
        isLevel = false;
        levelPill.className = 'status-pill';
        levelPill.innerText = `Tilt: ${deg}°`;
      }
    }
  });

  // 3. Mathematical Overlays Strategy Object
  const overlays = {
    thirds: (ctx, w, h, isLevel) => {
      ctx.beginPath();
      ctx.moveTo(w / 3, 0); ctx.lineTo(w / 3, h);
      ctx.moveTo((w / 3) * 2, 0); ctx.lineTo((w / 3) * 2, h);
      ctx.moveTo(0, h / 3); ctx.lineTo(w, h / 3);
      ctx.moveTo(0, (h / 3) * 2); ctx.lineTo(w, (h / 3) * 2);
      ctx.stroke();

      const points = [
        [w / 3, h / 3], [(w / 3) * 2, h / 3],
        [w / 3, (h / 3) * 2], [(w / 3) * 2, (h / 3) * 2]
      ];
      ctx.fillStyle = isLevel ? '#00ff66' : '#fff';
      points.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, 2 * Math.PI);
        ctx.fill();
      });
    },

    center: (ctx, w, h) => {
      ctx.beginPath();
      ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
      ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
      ctx.stroke();
    },

    golden: (ctx, w, h) => {
      const phiX1 = w * 0.382, phiX2 = w * 0.618;
      const phiY1 = h * 0.382, phiY2 = h * 0.618;
      ctx.beginPath();
      ctx.moveTo(phiX1, 0); ctx.lineTo(phiX1, h);
      ctx.moveTo(phiX2, 0); ctx.lineTo(phiX2, h);
      ctx.moveTo(0, phiY1); ctx.lineTo(w, phiY1);
      ctx.moveTo(0, phiY2); ctx.lineTo(w, phiY2);
      ctx.stroke();
    },

    diagonal: (ctx, w, h) => {
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(w, h);
      ctx.moveTo(w, 0); ctx.lineTo(0, h);
      ctx.moveTo(0, h); ctx.lineTo(w * 0.5, 0);
      ctx.moveTo(w, 0); ctx.lineTo(w * 0.5, h);
      ctx.stroke();
    },

    cinematic: (ctx, w, h) => {
      const targetHeight = w / 2.39;
      const barHeight = Math.max(0, (h - targetHeight) / 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, 0, w, barHeight);
      ctx.fillRect(0, h - barHeight, w, barHeight);
      ctx.strokeRect(0, barHeight, w, targetHeight);
    },

    leading: (ctx, w, h) => {
      ctx.beginPath();
      ctx.moveTo(0, h); ctx.lineTo(w / 2, h / 2);
      ctx.moveTo(w, h); ctx.lineTo(w / 2, h / 2);
      ctx.stroke();
    },

spiral: (ctx, w, h) => {
  ctx.save();
  
  // स्क्रीन के केंद्र में Golden Ratio (1 : 1.618) का बाउंडिंग बॉक्स सेट करें
  const PHI = 1.61803398875;
  let boxW = w * 0.9;
  let boxH = boxW / PHI;
  if (boxH > h * 0.9) {
    boxH = h * 0.9;
    boxW = boxH * PHI;
  }

  let x = (w - boxW) / 2;
  let y = (h - boxH) / 2;
  let curW = boxW;
  let curH = boxH;

  // 1. सब-डिवाइडिंग गोल्डन रेक्टैंगल्स और स्पाइरल आर्क्स
  // क्रम: Right, Bottom, Left, Top...
  const iterations = 8;
  const arcs = [];

  for (let i = 0; i < iterations; i++) {
    ctx.strokeRect(x, y, curW, curH);

    let squareSize, arcCenter, startAngle, endAngle;
    const step = i % 4;

    if (step === 0) { // बाएँ से वर्ग काटें
      squareSize = curH;
      arcCenter = { x: x + squareSize, y: y + squareSize };
      startAngle = Math.PI;
      endAngle = 1.5 * Math.PI;
      x += squareSize;
      curW -= squareSize;
    } else if (step === 1) { // ऊपर से वर्ग काटें
      squareSize = curW;
      arcCenter = { x: x, y: y + squareSize };
      startAngle = 1.5 * Math.PI;
      endAngle = 2 * Math.PI;
      y += squareSize;
      curH -= squareSize;
    } else if (step === 2) { // दाएँ से वर्ग काटें
      squareSize = curH;
      arcCenter = { x: x + curW - squareSize, y: y };
      startAngle = 0;
      endAngle = 0.5 * Math.PI;
      curW -= squareSize;
    } else if (step === 3) { // नीचे से वर्ग काटें
      squareSize = curW;
      arcCenter = { x: x + squareSize, y: y + curH - squareSize };
      startAngle = 0.5 * Math.PI;
      endAngle = Math.PI;
      curH -= squareSize;
    }

    arcs.push({ center: arcCenter, r: squareSize, start: startAngle, end: endAngle });
  }

  // 2. स्मूथ स्पाइरल लाइन खींचें (थोड़ी बोल्ड)
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  arcs.forEach((a, idx) => {
    ctx.arc(a.center.x, a.center.y, a.r, a.start, a.end);
  });
  ctx.stroke();

  ctx.restore();
}
  };

  // 4. Render Loop
  function drawGuides() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = isLevel ? '#00ff66' : 'rgba(255, 255, 255, 0.4)';

    if (overlays[currentMode]) {
      overlays[currentMode](ctx, w, h, isLevel);
    }

    requestAnimationFrame(drawGuides);
  }

  // 5. Mode Switcher
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.target) {
      event.target.classList.add('active');
    }
  }

  // 6. Snapshot Engine
  function takeSnapshot() {
    const snapCanvas = document.createElement('canvas');
    snapCanvas.width = video.videoWidth || 1920;
    snapCanvas.height = video.videoHeight || 1080;
    const snapCtx = snapCanvas.getContext('2d');
    
    snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
    
    const link = document.createElement('a');
    link.download = `snap_${Date.now()}.jpg`;
    link.href = snapCanvas.toDataURL('image/jpeg', 0.95);
    link.click();
    
    if (navigator.vibrate) navigator.vibrate(100);
  }

  startCamera();
  video.onloadedmetadata = () => drawGuides();
</script>
</body>
</html>
